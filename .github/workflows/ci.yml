name: CI

on:
  push:
  pull_request:

jobs:
  dashboard:
    name: Dashboard (Lint, Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Nur das Arbitrage-Modul wird geprüft; die bestehende Startseite ist davon ausgenommen.
      - run: npx eslint app/arbitrage lib shared proxy.ts scripts
      - run: npm run build
      # supabase/setup.sql muss zu den Migrationen passen.
      - run: npm run sql:bundle && git diff --exit-code supabase/setup.sql

  worker:
    name: Worker (Typecheck, Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
